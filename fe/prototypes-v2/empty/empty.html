<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空状态</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../base-resource/component/tokens.css">
<link rel="stylesheet" href="../../base-resource/component/components.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{ink:'var(--ink)',ink80:'var(--body-strong)',ink48:'var(--muted)',canvas:'var(--canvas)',card:'var(--surface-card)',muted:'var(--surface-cream-strong)',emphasis:'var(--surface-cream-strong)',selected:'var(--surface-cream-strong)',accent:'var(--primary)','on-primary':'var(--on-primary)'}}}}</script>
<style>
  /* tokens · body · t-title → ../../base-resource/component/{tokens,components}.css */
  /* triggers — Claude secondary buttons (canvas + hairline) */
  .trig{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border:1px solid var(--hairline);border-radius:8px;background:var(--canvas);font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;transition:background-color .15s;}
  .trig:hover{background:var(--surface-soft);}
  .trig.on{background:var(--surface-cream-strong);}
  /* region surface per state: KB/review/search = card; graph = canvas (+hairline); 关联 = cream-strong */
  .region{border-radius:12px;padding:72px 24px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;width:560px;transition:background-color .3s ease;}
  .region.kb,.region.rv,.region.sr{background:var(--surface-card);}
  .region.gr{background:var(--canvas);border:1px solid var(--hairline);}
  .region.bl{background:var(--surface-cream-strong);}
  /* three-dots logo — minimalist empty-state representation (no text); faint, premium */
  .logo{display:flex;gap:16px;align-items:center;justify-content:center;}
  .logo i{width:8px;height:8px;border-radius:9999px;background:var(--muted-soft);opacity:.28;}
  .hint{font-size:11px;color:var(--muted);}
</style>
</head>
<body class="min-h-screen m-0 p-10 flex flex-col items-center" style="background:#f5f0e8;">
  <div class="t-title text-[24px] text-[var(--ink)] mb-1">空状态</div>


  <div class="flex gap-2.5 mb-2 flex-wrap justify-center">
    <button class="trig on" data-k="kb">空知识库</button>
    <button class="trig" data-k="rv">空审核</button>
    <button class="trig" data-k="sr">无搜索结果</button>
    <button class="trig" data-k="gr">空图谱</button>
    <button class="trig" data-k="bl">无关联</button>
  </div>
  <div class="region kb" id="region">
    <div class="logo"><i></i><i></i><i></i></div>
  </div>


  <script>
  const STATES={kb:"kb",rv:"rv",sr:"sr",gr:"gr",bl:"bl"};
  const region=document.getElementById("region");
  function render(k){
    region.className="region "+STATES[k];
    document.querySelectorAll(".trig").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  }
  document.querySelectorAll(".trig").forEach(b=>b.addEventListener("click",()=>render(b.dataset.k)));
  render("kb");
  </script>
</body>
</html>

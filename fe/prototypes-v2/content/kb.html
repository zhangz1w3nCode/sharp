<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容区 · 知识库卡片浏览</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../base-resource/component/tokens.css">
<link rel="stylesheet" href="../../base-resource/component/components.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{ink:'var(--ink)',ink48:'var(--muted)',accent:'var(--primary)'}}}}</script>
<style>
  /* tokens · body · t-title → ../../base-resource/component/{tokens,components}.css */
  .desk{background:var(--surface-card);border-radius:12px;padding:12px;}
  /* Claude card: canvas (lightest) on surface-card desk; depth = color-block + hairline on hover (no shadow, no lift, no noise) */
  .card{position:relative;border-radius:8px;padding:14px;background:var(--canvas);display:flex;flex-direction:column;gap:7px;cursor:pointer;transition:background-color .18s ease,box-shadow .18s ease;box-shadow:0 0 0 1px transparent;}
  .card:hover,.card.sel{background:var(--surface-cream-strong);box-shadow:0 0 0 1px var(--hairline);}
  .t{font-size:15px;font-weight:600;color:var(--ink);line-height:1.3;}
  .s{font-size:12px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .m{display:flex;justify-content:flex-end;margin-top:4px;}
  .star{fill:none;stroke:var(--muted-soft);stroke-width:1.6;stroke-linejoin:round;transition:fill .15s,stroke .15s;}
  .star.on{fill:var(--primary);stroke:var(--primary);}
</style>
</head>
<body class="min-h-screen m-0 p-10 flex flex-col items-center" style="background:#f5f0e8;">
  <div class="t-title text-[22px] text-[var(--ink)] mb-1">内容区 · 知识库卡片浏览</div>

  <main class="w-[820px] h-[560px] desk flex flex-col">
    <div id="grid" class="flex-1 grid gap-2.5 content-start overflow-auto grid-cols-[repeat(auto-fill,minmax(220px,1fr))]"></div>
  </main>

  <script>
  const CARDS=[
    {t:"React Server Components 速记",s:"RSC 在服务端渲染、不 hydrate;与 Client Components 边界靠 'use client'。",f:true},
    {t:"Tauri v2 窗口 vibrancy",s:"macOS 用 windowEffects+vibrancy;需 NSVisualEffectView 兼容配置。",f:false},
    {t:"Tailwind v4 @theme 令牌",s:"CSS 用 @theme 定义 --color-* 即生成工具类,替代 tailwind.config。",f:true},
    {t:"知识图谱 force-directed 布局",s:"d3-force / vis-network;节点按 degree 缩放,边有向。",f:false},
    {t:"Wikilink 解析 [slug|ref]",s:"正则提取 slug 与显示文本;断链虚线 + 创建入口。",f:false},
    {t:"macOS HIG 三原则",s:"Clarity / Deference / Depth;内容优先、UI 克制、层级靠模糊与表面色。",f:true},
    {t:"SF Pro 字体回退栈",s:"-apple-system 在 macOS 解析为真 SF Pro;跨平台用 Inter 近似。",f:false},
    {t:"极简设计:去分隔线",s:"表面色反差 + 间隙分层,不用 hairline,更克制高级。",f:false},
  ];
  const STAR='<svg class="star" width="14" height="14" viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.8 19l1-5.8-4.2-4.1 5.8-.8z"/></svg>';
  const grid=document.getElementById('grid');
  grid.innerHTML=CARDS.map((c,i)=>`
    <div class="card" data-i="${i}">
      <div class="t">${c.t}</div>
      <div class="s">${c.s}</div>
      <div class="m">${STAR.replace('class="star"',c.f?'class="star on"':'class="star"')}</div>
    </div>`).join('');
  grid.addEventListener('click',e=>{
    const star=e.target.closest('.star');
    if(star){e.stopPropagation();star.classList.toggle('on');return;}
    const card=e.target.closest('.card'); if(!card)return;
    grid.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel')); card.classList.add('sel');
  });
  </script>
</body>
</html>

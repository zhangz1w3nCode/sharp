<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模块1 · 窗口框架</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../base-resource/component/tokens.css">
<link rel="stylesheet" href="../../base-resource/component/components.css">
<script src="../../base-resource/js/ui.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      ink:'var(--ink)', ink80:'var(--body-strong)', ink48:'var(--muted)',
      canvas:'var(--canvas)', card:'var(--surface-card)', muted:'var(--surface-cream-strong)', selected:'var(--surface-cream-strong)',
      accent:'var(--primary)', 'on-primary':'var(--on-primary)',
    },
    fontFamily:{ sans:['Inter','-apple-system','BlinkMacSystemFont','"Segoe UI"','Roboto','system-ui','sans-serif'], serif:['"Cormorant Garamond"','Songti SC','"Source Han Serif SC"','Georgia','serif'] },
  }}}
</script>
<style>
  /* tokens · body → ../../base-resource/component/tokens.css */

  /* ===== Claude warm surface scale: canvas → card → cream-strong (color-block depth, hairlines, no shadows) ===== */
  #win{
    --ink:#141413; --ink80:#252523; --ink48:#6c6a64;
    --canvas:#faf9f5; --card:#efe9de; --muted:#e8e0d2; --selected:#e8e0d2;
    --accent:#cc785c; --on-primary:#ffffff;
    --tbh:#f5f0e8;        /* toolbar hover = surface-soft */
    --s2h:#e8e0d2;        /* card hover = cream-strong */
    --sk:#e8e0d2;
  }
  #win header,#win aside,#win main,#win section,#win .sk,#win .row{ transition: background-color .25s ease, color .25s ease; }
  #win aside{ transition: width .25s ease, opacity .25s ease, background-color .25s ease; }

  /* traffic-light glyphs */
  .light{ position:relative; }
  .light::before{ content:""; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:rgba(0,0,0,.6); font-weight:700; opacity:0; transition:opacity .12s ease; }
  .lights:hover .light::before{ opacity:1; }
  .light.red::before{ content:"✕"; } .light.yellow::before{ content:"–"; } .light.green::before{ content:"+"; }

  /* window object: single soft shadow (OS chrome — Claude allows rare shadows for floating objects) */
  .win-shadow{ box-shadow:0 20px 60px rgba(20,20,19,.16), 0 0 0 1px var(--hairline); }
  .sk{ background:var(--sk); border-radius:4px; }

  /* resizer in the gap — transparent, faint coral tint on hover */
  .resizer{ position:relative; width:10px; flex:0 0 auto; cursor:col-resize; z-index:20; border-radius:6px; transition:background-color .2s; }
  .resizer:hover{ background:rgba(204,120,92,.08); }

  #win.sb-collapsed aside{ width:0 !important; opacity:0; padding:0; }
  #win.sb-collapsed .resizer.l{ display:none; }
  #win.maxed{ width:96vw !important; height:92vh !important; }
  #win .detail{ transition: width .25s ease, opacity .2s ease, background-color .25s ease; }
  #win.detail-closed .detail{ width:0 !important; opacity:0; padding:0 !important; pointer-events:none; }
  #win.detail-closed .resizer.r{ display:none; }
  /* cards: color-block depth + hairline on hover (no transform, no scale, no shadow) */
  #win .cardgrid > div{ cursor:pointer; transition: background-color .15s ease, box-shadow .15s ease; box-shadow:0 0 0 1px transparent; }
  #win .cardgrid > div:hover{ background:var(--selected); box-shadow:0 0 0 1px var(--hairline); }
  #win .cardgrid > div.sel{ background:var(--selected); box-shadow:0 0 0 1px var(--hairline); }
  #reopen{ opacity:0; pointer-events:none; transition:opacity .25s ease; }
  #reopen.show{ opacity:1; pointer-events:auto; }
</style>
</head>
<body class="h-full m-0 flex items-center justify-center p-6"
      style="background:#f5f0e8;">

  <!-- ============ Claude warm window ============ -->
  <div id="win" class="win-shadow w-[1100px] h-[700px] max-w-[94vw] max-h-[88vh] rounded-[12px] overflow-hidden flex flex-col bg-canvas p-3 transition-transform duration-200 detail-closed">

    <!-- titlebar (seamless on canvas, no bar bg, no border) -->
    <header id="titlebar" class="h-11 shrink-0 mb-2.5 flex items-center gap-1 px-1 cursor-default">
      <div class="lights flex items-center gap-2 pl-1 pr-2 shrink-0">
        <span class="light red w-3 h-3 rounded-full block" style="background:#ff5f57"></span>
        <span class="light yellow w-3 h-3 rounded-full block" style="background:#febc2e"></span>
        <span class="light green w-3 h-3 rounded-full block" style="background:#28c840"></span>
      </div>
      <div class="flex-1"></div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="t-sidebar" class="w-7 h-7 grid place-content-center rounded-[8px] text-ink hover:bg-[var(--tbh)] transition" title="折叠/展开侧栏 ⌘⌃S">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><line x1="9.5" y1="5" x2="9.5" y2="19"/></svg>
        </button>
        <button id="t-search" class="w-7 h-7 grid place-content-center rounded-[8px] text-ink hover:bg-[var(--tbh)] transition focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" title="搜索 ⌘F">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        </button>
        <button class="w-7 h-7 grid place-content-center rounded-[8px] text-ink hover:bg-[var(--tbh)] transition" title="知识图谱">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12" cy="17" r="2.3"/><path d="M8.1 8.1 16.2 16M8 6.6h8"/></svg>
        </button>
        <button class="w-7 h-7 grid place-content-center rounded-[8px] text-ink hover:bg-[var(--tbh)] transition" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="w-7 h-7 grid place-content-center rounded-[8px] text-ink hover:bg-[var(--tbh)] transition" title="新建卡片 ⌘N">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </header>

    <!-- body: isolated warm boxes, 10px gap (resizer = gap) -->
    <div class="flex-1 flex min-h-0">

      <!-- sidebar box (card surface) -->
      <aside class="w-[240px] shrink-0 rounded-[12px] bg-card p-2.5 flex flex-col overflow-hidden">
        <nav class="flex flex-col gap-0.5 text-[13px] tracking-[0.1px]">
          <div class="row h-7 flex items-center gap-2 px-2 rounded-[6px] bg-selected text-ink font-medium"><span class="w-1.5 h-1.5 rounded-full bg-accent"></span>知识库</div>
          <div class="row h-7 flex items-center gap-2 px-2 rounded-[6px] text-ink80 hover:bg-[var(--muted)]"><span class="w-1.5 h-1.5 rounded-full bg-ink48"></span>知识审核</div>
        </nav>
      </aside>

      <div class="resizer l" data-pane="aside"></div>

      <!-- content box (card surface) -->
      <main class="flex-1 min-w-0 rounded-[12px] bg-card p-2.5 flex flex-col">
        <div class="cardgrid flex-1 grid grid-cols-2 gap-2.5 content-start overflow-auto">
          <!-- cards: cream-strong bg, selected = surface + hairline (no border by default) -->
          <div class="rounded-[8px] bg-muted p-2.5 flex flex-col gap-2">
            <div class="sk h-2.5 w-2/3"></div><div class="sk h-2 w-full"></div><div class="sk h-2 w-1/2"></div>
            <div class="mt-1 flex items-center gap-1.5"><span class="sk h-4 w-9 rounded-[4px]"></span><span class="sk h-4 w-11 rounded-[4px]"></span><span class="sk h-2 w-9 ml-auto"></span></div>
          </div>
          <div class="rounded-[8px] bg-muted p-2.5 flex flex-col gap-2">
            <div class="sk h-2.5 w-1/2"></div><div class="sk h-2 w-full"></div><div class="sk h-2 w-2/3"></div>
            <div class="mt-1 flex items-center gap-1.5"><span class="sk h-4 w-8 rounded-[4px]"></span><span class="sk h-2 w-9 ml-auto"></span></div>
          </div>
          <div class="rounded-[8px] bg-muted p-2.5 flex flex-col gap-2">
            <div class="sk h-2.5 w-3/4"></div><div class="sk h-2 w-full"></div><div class="sk h-2 w-1/3"></div>
            <div class="mt-1 flex items-center gap-1.5"><span class="sk h-4 w-11 rounded-[4px]"></span><span class="sk h-4 w-8 rounded-[4px]"></span><span class="sk h-2 w-9 ml-auto"></span></div>
          </div>
          <div class="rounded-[8px] bg-muted p-2.5 flex flex-col gap-2">
            <div class="sk h-2.5 w-2/3"></div><div class="sk h-2 w-full"></div>
            <div class="mt-1 flex items-center gap-1.5"><span class="sk h-4 w-9 rounded-[4px]"></span><span class="sk h-2 w-9 ml-auto"></span></div>
          </div>
        </div>
      </main>

      <div class="resizer r" data-pane="section"></div>

      <!-- detail box (card surface) -->
      <section class="detail w-[360px] shrink-0 rounded-[12px] bg-card p-2.5 flex flex-col overflow-hidden">
        <div class="flex justify-end -mb-1">
          <button id="d-close" class="w-6 h-6 grid place-content-center rounded-[6px] text-ink48 hover:bg-[var(--muted)] hover:text-ink transition" title="关闭详情 (Esc)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
        </div>
        <div class="flex flex-col gap-3">
          <div class="sk h-3.5 w-2/3"></div>
          <div class="flex items-center gap-1.5"><span class="sk h-5 w-9 rounded-[4px]"></span><span class="sk h-5 w-11 rounded-[4px]"></span><span class="sk h-2.5 w-14 ml-auto"></span></div>
          <div class="mt-1 flex flex-col gap-2"><div class="sk h-2 w-full"></div><div class="sk h-2 w-full"></div><div class="sk h-2 w-4/5"></div><div class="sk h-2 w-full"></div><div class="sk h-2 w-3/5"></div></div>
        </div>
        <!-- backlinks nested box (cream-strong) -->
        <div class="mt-3 rounded-[8px] bg-muted p-2.5 flex flex-col gap-1.5">
          <div class="text-[11px] font-semibold tracking-[0.12px] text-ink48">反向链接 · 3</div>
          <div class="sk h-2.5 w-1/2"></div>
          <div class="sk h-2 w-3/4"></div>
          <div class="sk h-2.5 w-1/2"></div>
        </div>
      </section>
    </div>
  </div>

  <button id="reopen" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 h-10 px-5 rounded-[8px] bg-accent text-on-primary text-[14px] font-medium tracking-[0.1px] shadow-lg hover:bg-[var(--primary-active)] transition">重新打开窗口</button>

  <script>
  (function(){
    const win=document.getElementById('win'), titlebar=document.getElementById('titlebar');
    const aside=win.querySelector('aside'), detail=win.querySelector('section.detail'), reopen=document.getElementById('reopen');
    aside.style.width='240px';
    document.getElementById('t-sidebar').addEventListener('click',()=> win.classList.toggle('sb-collapsed'));

    /* makeResizer → base-resource/js/ui.js */
    makeResizer(win.querySelector('.resizer.l'), aside, 180, 380);
    makeResizer(win.querySelector('.resizer.r'), detail, 280, 520);

    /* window chrome (traffic lights + titlebar drag) → base-resource/js/ui.js */
    windowChrome(win,titlebar,reopen);

    /* detail: hidden by default; shown when a card is clicked */
    const grid=win.querySelector('.cardgrid');
    function openDetail(){ win.classList.remove('detail-closed'); }
    function closeDetail(){ win.classList.add('detail-closed'); win.querySelectorAll('.cardgrid > div.sel').forEach(el=>el.classList.remove('sel')); }
    if(grid){ grid.addEventListener('click',e=>{ const c=e.target.closest('.cardgrid > div'); if(!c) return; win.querySelectorAll('.cardgrid > div.sel').forEach(el=>el.classList.remove('sel')); c.classList.add('sel'); openDetail(); }); }
    const dClose=win.querySelector('#d-close'); if(dClose) dClose.addEventListener('click', closeDetail);
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });
  })();
  </script>
</body>
</html>

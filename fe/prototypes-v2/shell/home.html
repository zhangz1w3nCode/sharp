<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · 首页</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../base-resource/component/tokens.css">
<link rel="stylesheet" href="../../base-resource/component/components.css">
<script>
  tailwind.config={theme:{extend:{colors:{
    ink:'var(--ink)',ink80:'var(--body-strong)',ink48:'var(--muted)',
    canvas:'var(--canvas)',card:'var(--surface-card)',muted:'var(--surface-cream-strong)',selected:'var(--surface-cream-strong)',
    accent:'var(--primary)','on-primary':'var(--on-primary)',
  },fontFamily:{sans:['Inter','-apple-system','BlinkMacSystemFont','"Segoe UI"','Roboto','system-ui','sans-serif'],serif:['"Cormorant Garamond"','Songti SC','"Source Han Serif SC"','Georgia','serif']}}}}
</script>
<style>
  /* tokens + components: ../../base-resource/component/{tokens,components}.css */
  #win{ --tbh:var(--surface-soft); }

  #win{transition:transform .2s ease,opacity .2s ease;}
  #win.maxed{width:96vw !important;height:92vh !important;}
  #win aside{transition:width .25s ease,opacity .25s ease;}
  #win.sb-collapsed aside{width:0 !important;opacity:0;padding:0;}
  #win.sb-collapsed .resizer.l{display:none;}
  #win .detail{transition:width .25s ease,opacity .2s ease;}
  #win.detail-closed .detail{width:0 !important;opacity:0;padding:0 !important;pointer-events:none;}
  #win.detail-closed .resizer.r{display:none;}
  #reopen{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .25s ease;height:40px;padding:0 20px;border-radius:8px;background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:500;border:none;cursor:pointer;z-index:60;}
  #reopen.show{opacity:1;pointer-events:auto;}
  #reopen:hover{background:var(--primary-active);}



  .tb-new{background:var(--primary);color:var(--on-primary);border:1px solid var(--primary);transition:background-color .15s,border-color .15s;}
  .tb-new:hover{background:var(--primary-active);border-color:var(--primary-active);}
  .d-edit{font-size:13px;font-weight:500;color:var(--primary);text-decoration:none;margin-left:auto;}
  .d-edit:hover{text-decoration:underline;text-underline-offset:2px;}

  /* main header */
  .m-head{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;}
  .m-title{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-0.2px;color:var(--ink);}
  .m-count{font-size:12px;color:var(--muted-soft);margin-left:6px;font-family:var(--sans);}
  .m-search{margin-left:auto;width:180px;background:var(--canvas);border:1px solid var(--hairline);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s,width .2s;}
  .m-search::placeholder{color:var(--muted-soft);}
  .m-search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(204,120,92,.14);width:230px;}

  /* cards — canvas on surface-card; hover/sel = cream-strong + hairline (no lift) */
  .card{position:relative;border-radius:8px;padding:14px;background:var(--canvas);display:flex;flex-direction:column;gap:7px;cursor:pointer;transition:background-color .15s ease,box-shadow .15s ease;box-shadow:0 0 0 1px transparent;}
  .card:hover,.card.sel{background:var(--surface-cream-strong);box-shadow:0 0 0 1px var(--hairline);}
  .card .t{font-size:15px;font-weight:600;color:var(--ink);line-height:1.3;padding-right:18px;}
  .card .s{font-size:12.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .star{position:absolute;top:12px;right:12px;fill:none;stroke:var(--muted-soft);stroke-width:1.6;stroke-linejoin:round;transition:fill .15s,stroke .15s;cursor:pointer;}
  .star.on{fill:var(--primary);stroke:var(--primary);}

  /* detail — editorial reading surface */
  .d-title{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:-0.3px;color:var(--ink);line-height:1.2;flex:1;}
  .eyebrow{font-size:11px;font-weight:500;color:var(--muted-soft);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;}
  .d-sum{background:var(--surface-cream-strong);border-radius:8px;padding:11px 13px;font-size:13.5px;color:var(--body-strong);line-height:1.55;}
  .d-body{font-size:13.5px;color:var(--body);line-height:1.65;}
  .d-body h2{font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:-0.1px;color:var(--ink);margin:12px 0 5px;}
  .d-body h2:first-child{margin-top:0;}
  .d-body p{margin:0 0 7px;}
  .d-body ul{padding-left:17px;list-style:disc;margin:0 0 7px;line-height:1.7;}
  .d-body code{background:var(--surface-cream-strong);padding:1px 5px;border-radius:4px;font-size:12px;font-family:var(--mono);color:var(--ink);}
  .d-code{background:var(--surface-dark-soft);border-radius:7px;padding:11px 13px;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--on-dark-soft);margin:8px 0;overflow:auto;}
  .d-code .k{color:var(--accent-teal);font-weight:500;} .d-code .s{color:var(--accent-amber);} .d-code .c{color:var(--on-dark-soft);font-style:italic;}
  .wl{color:var(--primary);font-weight:500;text-decoration:none;}
  .wl:hover{text-decoration:underline;text-underline-offset:2px;}
  .bl-item{font-size:12.5px;display:flex;align-items:center;gap:7px;padding:7px 0;border-top:1px solid var(--hairline-soft);}
  .bl-item:first-child{border-top:none;padding-top:0;}
  .bl-src{color:var(--primary);font-weight:500;cursor:pointer;}
  .bl-src.broken{color:var(--muted-soft);text-decoration:underline dashed;font-weight:400;}
  .bl-rel{color:var(--muted);font-size:11px;}


  .emptygrid{grid-column:1/-1;text-align:center;color:var(--muted-soft);font-size:13px;padding:40px 0;}
</style>
</head>
<body class="h-full m-0 flex items-center justify-center p-6"
      style="background:#f5f0e8;">

  <!-- ============ Claude design · app home (realized from 01-shell skeleton) ============ -->
  <div id="win" class="win-shadow w-[1180px] h-[760px] max-w-[94vw] max-h-[88vh] rounded-[12px] overflow-hidden flex flex-col bg-canvas p-3 detail-closed">

    <!-- titlebar (seamless on canvas) -->
    <header id="titlebar" class="h-11 shrink-0 mb-2.5 flex items-center gap-1 px-1 cursor-default">
      <div class="lights flex items-center gap-2 pl-1 pr-2 shrink-0">
        <span class="light red w-3 h-3 rounded-full block" style="background:#ff5f57"></span>
        <span class="light yellow w-3 h-3 rounded-full block" style="background:#febc2e"></span>
        <span class="light green w-3 h-3 rounded-full block" style="background:#28c840"></span>
      </div>
      <div class="flex items-center gap-2 pl-1 shrink-0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="var(--primary)" style="display:block"><path d="M12 2c.6 4.6 3.4 7.4 8 8-4.6.6-7.4 3.4-8 8-.6-4.6-3.4-7.4-8-8 4.6-.6 7.4-3.4 8-8z"/></svg>
        <span class="text-[13px] font-medium text-ink tracking-[0.1px] select-none">知识库</span>
      </div>
      <div class="flex-1"></div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="t-sidebar" class="tb w-7 h-7 grid place-content-center rounded-[8px] text-ink" title="折叠侧栏 ⌘⌃S">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><line x1="9.5" y1="5" x2="9.5" y2="19"/></svg>
        </button>
        <button id="t-search" class="tb w-7 h-7 grid place-content-center rounded-[8px] text-ink" title="筛选 ⌘F">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        </button>
        <a href="../detail/edit.html" class="tb-new h-8 w-8 grid place-content-center rounded-[8px]" title="新建卡片 ⌘N">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </a>
      </div>
    </header>

    <!-- body: isolated warm boxes, resizer = gap -->
    <div class="flex-1 flex min-h-0">

      <!-- sidebar -->
      <aside class="w-[240px] shrink-0 rounded-[12px] bg-card p-2.5 flex flex-col overflow-hidden">
        <nav class="flex flex-col gap-0.5 text-[13px] tracking-[0.1px]">
          <div class="entry active h-7 flex items-center gap-2 px-2 rounded-[6px]" data-view="kb"><span class="dot w-1.5 h-1.5 rounded-full"></span>知识库</div>
          <a href="../review/queue.html" class="entry h-7 flex items-center gap-2 px-2 rounded-[6px]" data-view="review"><span class="dot w-1.5 h-1.5 rounded-full"></span>知识审核</a>
          <a href="../graph/graph.html" class="entry h-7 flex items-center gap-2 px-2 rounded-[6px]" data-view="graph"><span class="dot w-1.5 h-1.5 rounded-full"></span>知识图谱</a>
          <a href="../sheets/sheets.html" class="entry h-7 flex items-center gap-2 px-2 rounded-[6px]" data-view="settings"><span class="dot w-1.5 h-1.5 rounded-full"></span>设置</a>
        </nav>
      </aside>

      <div class="resizer l" data-pane="aside"></div>

      <!-- main -->
      <main class="flex-1 min-w-0 rounded-[12px] bg-card p-2.5 flex flex-col">
        <div class="m-head">
          <div class="m-title">知识库<span class="m-count" id="count">· 8 张</span></div>
          <input class="m-search" id="filter" placeholder="筛选卡片…" autocomplete="off">
        </div>
        <div id="grid" class="flex-1 grid gap-2.5 content-start overflow-auto grid-cols-[repeat(auto-fill,minmax(210px,1fr))]"></div>
      </main>

      <div class="resizer r" data-pane="section"></div>

      <!-- detail -->
      <section class="detail w-[380px] shrink-0 rounded-[12px] bg-card p-2.5 flex flex-col overflow-hidden">
        <div class="flex items-center gap-2 -mb-1">
          <button id="d-close" class="w-6 h-6 grid place-content-center rounded-[6px] text-[var(--muted)] hover:bg-[var(--muted)] hover:text-ink transition ml-auto" title="关闭详情 (Esc)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
        </div>
        <div id="detail" class="flex-1 overflow-auto flex flex-col gap-4 px-1 pb-1"></div>
      </section>
    </div>
  </div>

  <button id="reopen">重新打开窗口</button>
  <div class="toast" id="toast"></div>
  <script src="../../base-resource/js/ui.js"></script>

  <script>
  const STAR='<svg class="star" width="14" height="14" viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.8 19l1-5.8-4.2-4.1 5.8-.8z"/></svg>';
  const CARDS=[
    {t:"React Server Components 速记",s:"RSC 在服务端渲染、不 hydrate;与 Client Components 边界靠 'use client'。",f:true,
     summary:"RSC 在服务端渲染、不 hydrate;与 Client Components 边界靠 'use client'。",
     body:`<h2>边界</h2><p>服务端组件不能 <code>useState</code> / <code>useEffect</code>。客户端组件以 <code>'use client'</code> 声明。相关见 <a class="wl" onclick="toast('打开 Tauri vibrancy')">Tauri vibrancy</a>。</p><div class="d-code"><span class="c">// 边界靠指令</span>\n<span class="k">'use client'</span>\n<span class="k">export</span> <span class="k">function</span> Button(){…}</div>`,
     backlinks:[{n:"Tauri v2 vibrancy",r:"相关"},{n:"SF Pro 字体回退栈",r:"扩展"}]},
    {t:"Tauri v2 窗口 vibrancy",s:"macOS 用 windowEffects + vibrancy;需 NSVisualEffectView 兼容配置。",f:false,
     summary:"macOS 下窗口毛玻璃的实现要点与 NSVisualEffectView 兼容配置。",
     body:`<h2>实现</h2><p>通过 <code>windowEffects</code> 配置 vibrancy,需 NSVisualEffectView 兼容。相关见 <a class="wl" onclick="toast('打开 macOS HIG')">macOS HIG</a>。</p><div class="d-code"><span class="c">// tauri.conf.json</span>\n<span class="k">"windowEffects"</span>: {\n  <span class="k">"effects"</span>: [<span class="s">"sidebar"</span>],\n  <span class="k">"state"</span>: <span class="s">"active"</span>\n}</div><h2>要点</h2><ul><li>配置 NSVisualEffectView + NSHUDWindowMaterial</li><li>断链显示虚线,点击可创建</li></ul>`,
     backlinks:[{n:"macOS HIG 三原则",r:"引用"},{n:"Wikilink 解析",r:"相关"},{n:"未知文档",r:"引用",broken:true}]},
    {t:"Tailwind v4 @theme 令牌",s:"CSS 用 @theme 定义 --color-* 即生成工具类,替代 tailwind.config。",f:true,
     summary:"@theme 定义 --color-* 即生成工具类,替代 tailwind.config。",
     body:`<h2>用法</h2><p>在 CSS 中以 <code>@theme</code> 声明令牌,工具类自动生成。</p><div class="d-code"><span class="k">@theme</span> {\n  --color-canvas: <span class="s">#faf9f5</span>;\n  --color-primary: <span class="s">#cc785c</span>;\n}</div>`,
     backlinks:[{n:"极简设计:去分隔线",r:"相关"}]},
    {t:"知识图谱 force-directed 布局",s:"d3-force / vis-network;节点按 degree 缩放,边有向。",f:false,
     summary:"d3-force / vis-network;节点按入度放大,边有向。",
     body:`<h2>规则</h2><ul><li>节点按入度(in-degree)放大</li><li>边有向:A 含 [B|…] 则 A→B</li><li>断链节点虚线浅色</li></ul>`,
     backlinks:[{n:"Wikilink 解析",r:"依赖"}]},
    {t:"Wikilink 解析 [path|relation]",s:"正则提取 slug 与显示文本;断链虚线 + 创建入口。",f:false,
     summary:"正则提取 path 与 relation;断链虚线 + 创建入口。",
     body:`<h2>格式</h2><p><code>[.knowledges/notes/x.md|关系]</code> · relation 为自由文本。读模式只显文件名。</p><div class="d-code"><span class="c">// 提取</span>\n<span class="k">const</span> m = s.match(/\\[([^|\\]]+)(?:\\|([^\\]]+))?\\]/);</div>`,
     backlinks:[{n:"Tauri v2 vibrancy",r:"相关"}]},
    {t:"macOS HIG 三原则",s:"Clarity / Deference / Depth;内容优先、UI 克制、层级靠模糊与表面色。",f:true,
     summary:"Clarity(清晰)/ Deference(克制)/ Depth(层次)。",
     body:`<h2>三原则</h2><ul><li>Clarity — 内容优先,UI 克制</li><li>Deference — 控件不抢戏</li><li>Depth — 层级靠模糊与表面色,非阴影</li></ul>`,
     backlinks:[{n:"Tauri v2 vibrancy",r:"引用"},{n:"极简设计:去分隔线",r:"引用"}]},
    {t:"SF Pro 字体回退栈",s:"-apple-system 在 macOS 解析为真 SF Pro;跨平台用 Inter 近似。",f:false,
     summary:"-apple-system 在 macOS 解析为真 SF Pro;跨平台用 Inter 近似。",
     body:`<h2>回退</h2><div class="d-code">font-family: <span class="s">'Inter'</span>,\n  -apple-system, BlinkMacSystemFont,\n  <span class="s">'Segoe UI'</span>, sans-serif;</div>`,
     backlinks:[]},
    {t:"极简设计:去分隔线",s:"表面色反差 + 间隙分层,不用 hairline,更克制高级。",f:false,
     summary:"表面色反差 + 间隙分层,不用 hairline,更克制高级。",
     body:`<h2>手法</h2><ul><li>box 隔离:色调反差 + 圆角</li><li>无描边、无分割线</li><li>留白承担分层</li></ul>`,
     backlinks:[{n:"macOS HIG 三原则",r:"引用"}]},
  ];

  const grid=document.getElementById('grid'),filterInput=document.getElementById('filter'),countEl=document.getElementById('count'),detailEl=document.getElementById('detail');
  let current=-1;

  /* esc → base-resource/js/ui.js */
  function renderGrid(filter=''){
    const f=filter.trim().toLowerCase();
    const list=CARDS.map((c,i)=>({c,i})).filter(({c})=>!f||c.t.toLowerCase().includes(f)||c.s.toLowerCase().includes(f));
    countEl.textContent='· '+list.length+' 张';
    grid.innerHTML=list.length?list.map(({c,i})=>`
      <div class="card${i===current?' sel':''}" data-i="${i}">
        <div class="t">${esc(c.t)}</div>
        <div class="s">${esc(c.s)}</div>
        ${STAR.replace('class="star"',c.f?'class="star on"':'class="star"')}
      </div>`).join(''):'<div class="emptygrid">无匹配卡片</div>';
  }

  function openDetail(i){
    current=i;
    const c=CARDS[i];
    document.querySelectorAll('#grid .card').forEach(el=>el.classList.toggle('sel',+el.dataset.i===i));
    const bl=c.backlinks.map(b=>`<div class="bl-item"><span class="bl-src${b.broken?' broken':''}" onclick="toast('打开 ${esc(b.n)}')">${esc(b.n)}</span><span class="bl-rel">· ${esc(b.r)}</span></div>`).join('');
    detailEl.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="d-title">${esc(c.t)}</div>
        <a href="../detail/edit.html" class="d-edit" onclick="toast('编辑 → 编辑器')" title="编辑"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
        <svg class="star ${c.f?'on':''}" width="17" height="17" viewBox="0 0 24 24" style="flex:0 0 auto;cursor:pointer;fill:${c.f?'var(--primary)':'none'};stroke:${c.f?'var(--primary)':'var(--muted-soft)'};stroke-width:1.6;stroke-linejoin:round;" onclick="this.classList.toggle('on');this.style.fill=this.classList.contains('on')?'var(--primary)':'none';this.style.stroke=this.classList.contains('on')?'var(--primary)':'var(--muted-soft)';"><path d="M12 3l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.8 19l1-5.8-4.2-4.1 5.8-.8z"/></svg>
      </div>
      <div class="d-sum">${esc(c.summary)}</div>
      <div class="d-body">${c.body}</div>
      ${c.backlinks.length?`<div class="d-links"><div class="eyebrow">关联</div>${bl}</div>`:''}`;
    win.classList.remove('detail-closed');
  }
  function closeDetail(){ win.classList.add('detail-closed'); current=-1; document.querySelectorAll('#grid .card.sel').forEach(el=>el.classList.remove('sel')); }

  grid.addEventListener('click',e=>{
    const star=e.target.closest('.star'); if(star){e.stopPropagation();star.classList.toggle('on');const i=+star.closest('.card').dataset.i;CARDS[i].f=star.classList.contains('on');return;}
    const card=e.target.closest('.card'); if(!card)return; openDetail(+card.dataset.i);
  });
  filterInput.addEventListener('input',()=>renderGrid(filterInput.value));
  document.getElementById('d-close').addEventListener('click',closeDetail);

  const win=document.getElementById('win');
  document.getElementById('t-sidebar').addEventListener('click',()=>win.classList.toggle('sb-collapsed'));
  document.getElementById('t-search').addEventListener('click',()=>filterInput.focus());

  // resizers (makeResizer → base-resource/js/ui.js)
  makeResizer(win.querySelector('.resizer.l'),win.querySelector('aside'),180,380);
  makeResizer(win.querySelector('.resizer.r'),win.querySelector('section.detail'),300,520);

  // window chrome (traffic lights + titlebar drag) → base-resource/js/ui.js
  const titlebar=document.getElementById('titlebar');
  const reopen=document.getElementById('reopen');
  windowChrome(win,titlebar,reopen);

  // keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeDetail();}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){e.preventDefault();filterInput.focus();}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();location.href='../detail/edit.html';}
    if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key.toLowerCase()==='s'){e.preventDefault();document.getElementById('t-sidebar').click();}
  });

  /* toast → base-resource/js/ui.js */

  renderGrid();
  </script>
</body>
</html>

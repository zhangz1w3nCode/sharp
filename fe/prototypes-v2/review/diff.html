<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识审核 · 改动 diff</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../base-resource/component/tokens.css">
<link rel="stylesheet" href="../../base-resource/component/components.css">
<script src="../../base-resource/js/ui.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* tokens · body · t-title → ../../base-resource/component/{tokens,components}.css */
  .panel{width:760px;background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:20px;}
  .h-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .title{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-0.3px;color:var(--ink);flex:1;line-height:1.2;}
  .badge{background:var(--surface-cream-strong);color:var(--muted);border-radius:4px;padding:2px 8px;font-size:11px;}
  .status{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
  .dot{width:6px;height:6px;border-radius:9999px;background:var(--primary);}
  .dot.muted{background:var(--muted-soft);}
  .btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:background-color .15s,border-color .15s;}
  .btn.primary{background:var(--primary);color:var(--on-primary);border:1px solid var(--primary);}
  .btn.primary:hover{background:var(--primary-active);border-color:var(--primary-active);}
  .btn.secondary{background:var(--canvas);color:var(--ink);border:1px solid var(--hairline);}
  .btn.secondary:hover{background:var(--surface-soft);}
  .eyebrow{font-size:12px;font-weight:500;color:var(--muted-soft);letter-spacing:1.5px;text-transform:uppercase;}
  /* diff = DARK NAVY code-window-card (Claude signature) + semantic error/success tints */
  .diff-headers{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-bottom:8px;}
  .diff-col-h{font-size:11px;color:var(--muted-soft);font-weight:500;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px;padding:2px 4px;}
  .diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;background:var(--surface-dark-soft);border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--on-dark-soft);}
  .ln{display:flex;gap:8px;white-space:pre-wrap;word-break:break-word;padding:2px 6px;border-radius:4px;}
  .ln.ctx{color:var(--on-dark-soft);}
  .ln.del{background:rgba(198,69,69,.22);color:var(--on-dark);text-decoration:line-through;text-decoration-color:rgba(250,249,245,.35);}
  .ln.add{background:rgba(93,184,114,.20);color:var(--on-dark);}
  .ln .sign{flex:0 0 auto;width:10px;font-weight:700;}
  .ln.ctx .sign{color:rgba(250,249,245,.2);}
  .ln.del .sign{color:var(--error);}
  .ln.add .sign{color:var(--success);}
  .ln.empty{opacity:.4;color:var(--on-dark-soft);}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-dark);color:var(--on-dark);font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
  .toast.show{opacity:1;}
</style>
</head>
<body class="min-h-screen m-0 p-10 flex flex-col items-center" style="background:#f5f0e8;">
  <div class="t-title text-[24px] text-[var(--ink)] mb-1">知识审核 · 改动 diff</div>


  <section class="panel">
    <div class="h-row">
      <div class="title">Tauri v2 窗口 vibrancy</div>
      <span class="badge">大模型</span>
      <div class="status"><span class="dot"></span>待审</div>
    </div>


    <div>
      <div class="eyebrow" style="margin-bottom:8px;">改动</div>
      <div class="diff-headers">
        <div class="diff-col-h"><span class="dot muted"></span>当前 · 已通过</div>
        <div class="diff-col-h"><span class="dot"></span>提议 · 待审</div>
      </div>
      <div class="diff-grid" id="diffgrid"></div>
    </div>

    <div class="h-row" style="margin-top:auto;">
      <button class="btn secondary" style="width:36px;padding:0;justify-content:center" onclick="location.href='queue.html'" title="返回队列"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></button>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="btn secondary" style="width:36px;padding:0;justify-content:center" onclick="location.href='../detail/edit.html'" title="编辑"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="btn primary" style="width:36px;padding:0;justify-content:center" onclick="approve()" title="通过"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <script>
  const ROWS=[
    {t:"ctx", l:"## 实现", r:"## 实现"},
    {t:"del", l:"通过 windowEffects 配置 vibrancy,需 NSVisualEffectView 兼容。", r:""},
    {t:"add", l:"", r:"通过 windowEffects 配置 vibrancy,需 NSVisualEffectView + NSHUDWindowMaterial 兼容。"},
    {t:"ctx", l:"```tauri.conf.json", r:"```tauri.conf.json"},
    {t:"ctx", l:'"windowEffects": { "effects": ["sidebar"] }', r:'"windowEffects": { "effects": ["sidebar"] }'},
    {t:"ctx", l:"```", r:"```"},
    {t:"ctx", l:"## 要点", r:"## 要点"},
    {t:"del", l:"- 配置 NSVisualEffectView", r:""},
    {t:"add", l:"", r:"- 配置 NSVisualEffectView + NSHUDWindowMaterial"},
    {t:"del", l:"- 字体回退见 SF Pro", r:""},
    {t:"add", l:"", r:"- 字体回退见 SF Pro 字体回退栈"},
    {t:"add", l:"", r:"- 断链处理见 Wikilink 解析"},
  ];
  /* esc → base-resource/js/ui.js */
  function cell(text,sign,cls){return `<div class="ln ${cls}"><span class="sign">${sign}</span><span>${esc(text)}</span></div>`;}
  document.getElementById("diffgrid").innerHTML=ROWS.map(r=>{
    if(r.t==="ctx") return cell(r.l," ","ctx")+cell(r.r," ","ctx");
    if(r.t==="del") return cell(r.l,"-","del")+cell("·"," ","empty");
    return cell("·"," ","empty")+cell(r.r,"+","add");
  }).join("");

  /* toast → base-resource/js/ui.js */
  function approve(){toast("已通过 → 替换知识库卡片");setTimeout(()=>location.href="queue.html",1400);}
  </script>
</body>
</html>

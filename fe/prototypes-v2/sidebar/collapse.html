<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>侧栏 · 折叠</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../base-resource/component/tokens.css">
<link rel="stylesheet" href="../../base-resource/component/components.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{ink:'var(--ink)',ink80:'var(--body-strong)',ink48:'var(--muted)',card:'var(--surface-card)',muted:'var(--surface-cream-strong)',selected:'var(--surface-cream-strong)',accent:'var(--primary)'}}}}</script>
<style>
  /* tokens · body · t-title → ../../base-resource/component/{tokens,components}.css */
  .entry{height:28px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:6px;font-size:13px;letter-spacing:.1px;cursor:pointer;transition:background-color .2s ease,color .2s ease;}
  .entry .d{width:6px;height:6px;border-radius:9999px;flex:0 0 auto;transition:background-color .2s ease;}
  .entry.active{background:var(--surface-cream-strong);color:var(--ink);font-weight:500;}
  .entry.active .d{background:var(--primary);}
  .entry:not(.active){color:var(--body-strong);}
  .entry:not(.active):hover{background:var(--surface-soft);}
  .entry:not(.active) .d{background:var(--muted-soft);}
  #sb{transition:width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1),opacity .25s ease,padding .3s ease;}
  #sb.collapsed{width:0!important;height:0!important;opacity:0;padding:0!important;}
  .tb{transition:background-color .15s ease;}
  .tb:hover{background:var(--surface-soft);}
  .cap{font-size:11px;color:var(--muted);letter-spacing:.1px;margin-top:8px;text-align:center;}
</style>
</head>
<body class="min-h-screen m-0 p-10 flex flex-col items-center" style="background:#f5f0e8;">
  <div class="t-title text-[20px] text-[var(--ink)] mb-1">侧栏 · 折叠</div>


  <div class="flex flex-col items-center gap-3">
    <button id="t" class="tb w-7 h-7 grid place-content-center rounded-[8px] bg-card text-ink" title="折叠/展开 ⌘⌃S">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><line x1="9.5" y1="5" x2="9.5" y2="19"/></svg>
    </button>
    <aside id="sb" class="w-[240px] h-[520px] rounded-[12px] bg-card p-2.5 flex flex-col overflow-hidden">
      <nav class="flex flex-col gap-0.5">
        <div class="entry active"><span class="d"></span>知识库</div>
        <div class="entry"><span class="d"></span>知识审核</div>
      </nav>
    </aside>

  </div>

  <script>
  (function(){
    const t=document.getElementById('t'),sb=document.getElementById('sb');
    t.addEventListener('click',()=>sb.classList.toggle('collapsed'));
    document.querySelectorAll('.entry').forEach(e=>e.addEventListener('click',()=>{
      const nav=e.closest('nav'); nav.querySelectorAll('.entry').forEach(x=>x.classList.remove('active')); e.classList.add('active');
    }));
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>侧栏 · 焦点原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../base-resource/component/tokens.css">
<link rel="stylesheet" href="../../base-resource/component/components.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config={theme:{extend:{colors:{
    ink:'var(--ink)',ink80:'var(--body-strong)',ink48:'var(--muted)',
    canvas:'var(--canvas)',card:'var(--surface-card)',muted:'var(--surface-cream-strong)',selected:'var(--surface-cream-strong)',accent:'var(--primary)',
  },fontFamily:{sans:['Inter','-apple-system','BlinkMacSystemFont','"Segoe UI"','Roboto','system-ui','sans-serif'],serif:['"Cormorant Garamond"','Songti SC','Georgia','serif']}}}}
</script>
<style>
  /* tokens · body · t-title → ../../base-resource/component/{tokens,components}.css */

  /* ===== entry interaction (Claude: color-block depth, no transforms) ===== */
  .entry{cursor:pointer;transition:background-color .2s ease,color .2s ease;}
  .entry .dot{transition:background-color .2s ease;}
  .entry.active{background:var(--surface-cream-strong);color:var(--ink);font-weight:500;}
  .entry.active .dot{background:var(--primary);}
  .entry:not(.active){color:var(--body-strong);}
  .entry:not(.active):hover{background:var(--surface-soft);}
  .entry:not(.active):hover .dot{background:var(--muted-soft);}
  .entry:not(.active) .dot{background:var(--muted-soft);}
  /* keyboard focus ring — coral (Claude text-input-focused = coral) */
  .entry.focused{box-shadow:inset 0 0 0 2px var(--primary);}

  /* ===== collapse animation (width + height + opacity + padding) ===== */
  #sidebar{transition:width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1),opacity .25s ease,padding .3s ease;}
  #sidebar.collapsed{width:0!important;height:0!important;opacity:0;padding:0!important;}

  /* toggle */
  .tb{transition:background-color .15s ease;}
  .tb:hover{background:var(--surface-soft);}
</style>
</head>
<body class="min-h-screen m-0 flex items-center justify-center p-10"
      style="background:#f5f0e8;">

  <div class="flex flex-col items-start gap-3">

    <!-- mini control: collapse toggle (mirrors app titlebar sidebar-toggle) -->
    <button id="toggle" class="tb w-7 h-7 grid place-content-center rounded-[8px] bg-card text-ink" title="折叠/展开侧栏 ⌘⌃S">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><line x1="9.5" y1="5" x2="9.5" y2="19"/></svg>
    </button>

    <!-- the sidebar (focused, isolated) -->
    <aside id="sidebar" class="w-[240px] h-[560px] rounded-[12px] bg-card p-2.5 flex flex-col overflow-hidden">
      <nav id="nav" class="flex flex-col gap-0.5 text-[13px] tracking-[0.1px]">
        <div class="entry active h-7 flex items-center gap-2 px-2 rounded-[6px]" data-view="kb" tabindex="0"><span class="dot w-1.5 h-1.5 rounded-full"></span>知识库</div>
        <div class="entry h-7 flex items-center gap-2 px-2 rounded-[6px]" data-view="review" tabindex="0"><span class="dot w-1.5 h-1.5 rounded-full"></span>知识审核</div>
      </nav>
      <!-- empty space below is intentional: sidebar is minimal (2 entries) -->
    </aside>


  </div>

  <script>
  (function(){
    const nav=document.getElementById('nav');
    const entries=[...nav.querySelectorAll('.entry')];
    const toggle=document.getElementById('toggle');
    const sidebar=document.getElementById('sidebar');

    function setActive(view){
      entries.forEach(e=> e.classList.toggle('active', e.dataset.view===view));
    }
    function activeIndex(){ return entries.findIndex(e=>e.classList.contains('active')); }
    function flashFocus(i){
      entries.forEach(e=>e.classList.remove('focused'));
      entries[i].classList.add('focused');
      clearTimeout(flashFocus._t); flashFocus._t=setTimeout(()=>entries[i].classList.remove('focused'),700);
    }
    function moveActive(dir){
      let i=activeIndex(); if(i<0)i=0;
      i=(i+dir+entries.length)%entries.length;
      setActive(entries[i].dataset.view);
      flashFocus(i);
    }

    nav.addEventListener('click',e=>{ const en=e.target.closest('.entry'); if(!en)return; setActive(en.dataset.view); });
    entries.forEach(en=> en.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){e.preventDefault();moveActive(1);entries[activeIndex()].focus();}
      else if(e.key==='ArrowUp'){e.preventDefault();moveActive(-1);entries[activeIndex()].focus();}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();setActive(en.dataset.view);}
    }));

    toggle.addEventListener('click',()=> sidebar.classList.toggle('collapsed'));

    document.addEventListener('keydown',e=>{
      if(e.target.closest('.entry')) return; // handled per-entry above
      if(e.key==='ArrowDown'){e.preventDefault();moveActive(1);}
      else if(e.key==='ArrowUp'){e.preventDefault();moveActive(-1);}
      else if(e.metaKey&&e.key==='1'){e.preventDefault();setActive('kb');}
      else if(e.metaKey&&e.key==='2'){e.preventDefault();setActive('review');}
      else if(e.metaKey&&e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();toggle.click();}
    });
  })();
  </script>
</body>
</html>

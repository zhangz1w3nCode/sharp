[package]
name = "akb-core"
version.workspace = true
edition.workspace = true

[lib]
name = "akb_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
petgraph = "0.7"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

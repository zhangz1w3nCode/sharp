[package]
name = "akb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "akb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
petgraph = "0.7"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3